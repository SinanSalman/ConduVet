title: "Sample Data Vetting"
admin_account: "admin"
admin_pass: "password"
backup_dir: "./backups"
auto_logout_minutes: 30  # Optional, defaults to 30

# Admin login IP allowlist. Each entry is an IPv4 pattern where '*' is a wildcard octet.
# Examples: "192.168.1.*" (single subnet), "10.0.*.*" (wider range), "*.*.*.*" (any IP).
admin_allowed_ips:
  - "*.*.*.*"

# PIN authentication settings
pin_expiration_minutes: 15

# SMTP configuration
smtp_config:
  host: "smtp.gmail.com"
  port: 25
  username: "your-email@gmail.com"
  password: "your-app-password"
  use_tls: False