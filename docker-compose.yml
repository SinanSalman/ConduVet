services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: conduvet
      POSTGRES_USER: conduvet
      POSTGRES_PASSWORD: conduvet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduvet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://conduvet:conduvet@db:5432/conduvet
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./users.csv:/app/users.csv:ro
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - "**/__pycache__"
            - ".git"
        - action: rebuild
          path: ./backend/requirements.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          ignore:
            - "**/node_modules"
            - "**/dist"

volumes:
  postgres_data:
  backups:
